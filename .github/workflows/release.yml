name: Release

# Pushing a v<versionName> tag on main builds the signed APK and drafts a GitHub release with it (docs/releasing.md).
# The tests and the full lint already ran in CI on that commit; assembleRelease adds lint's fatal checks.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the main check needs the history
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main: merge develop into main and tag there"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Signed release build
        env:
          KEYSTORE_BASE64: ${{ secrets.TABLERO_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_TABLERO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_TABLERO_KEYSTORE_PASSWORD: ${{ secrets.TABLERO_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TABLERO_KEY_ALIAS: ${{ secrets.TABLERO_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TABLERO_KEY_PASSWORD: ${{ secrets.TABLERO_KEY_PASSWORD }}
        run: |
          if [[ -z $KEYSTORE_BASE64 || -z $ORG_GRADLE_PROJECT_TABLERO_KEYSTORE_PASSWORD
                || -z $ORG_GRADLE_PROJECT_TABLERO_KEY_ALIAS || -z $ORG_GRADLE_PROJECT_TABLERO_KEY_PASSWORD ]]; then
            echo "::error::A TABLERO_KEY* secret is missing (docs/releasing.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew :tv-app:assembleRelease
      - name: Check the version and name the APK
        run: |
          apks=tv-app/build/outputs/apk/release
          version=$(jq -r '.elements[0].versionName' "$apks/output-metadata.json")
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersionName $version in tv-app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # An unsigned build is named tv-app-release-unsigned.apk, so this fails on one.
          cp "$apks/tv-app-release.apk" "tablero-tv-$version.apk"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "tablero-tv-$VERSION.apk" --draft --verify-tag \
            --title "tablero $VERSION" --generate-notes
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: tv-app/build/reports/
