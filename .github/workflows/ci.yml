name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Engine tests, TV app unit tests and lint
        run: ./gradlew :shared:test :tv-app:testDebugUnitTest :tv-app:lintDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            shared/build/reports/
            tv-app/build/reports/
