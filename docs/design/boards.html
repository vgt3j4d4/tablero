<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tablero design boards</title>
<!--
  Source of the design images in this folder. Each board is a 1920×1080 TV screen.
  Open boards.html?board=<id>&lang=<en|es> in a browser, or run ./render.sh to regenerate the PNGs.
-->
<style>
@font-face { font-family: 'DSEG7 Classic'; src: url(fonts/DSEG7Classic-Bold.woff2) format('woff2'); font-weight: 700; font-display: block; }
@font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2'); font-weight: 500; font-display: block; }
@font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: block; }
@font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: block; }
@font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); font-weight: 800; font-display: block; }

:root {
  --bg: #07080A;
  --panel: #111317;
  --panel-raised: #1A1D22;
  --line: #262A31;
  --line-soft: #16191D;
  --text: #F5F2EA;
  --soft: #B4B9C0;
  --muted: #8B919B;
  --faint: #6B717A;
  --off: #3A3F47;
  --clock: #FF3B2F;
  --score: #FFB21E;
  --alert: #D92D20;
  --alert-frame: #FF3B2F;
  --adjust: #FFB21E;
  --adjust-ink: #3A2A05;
  /* The board's own colors; menu, scrim, dialogs and bars over the board use the tokens above in both modes. */
  --board-bg: var(--bg);
  --board-text: var(--text);
  --clock-box: #0B0C0E;
  --clock-box-border: #1A1D22;
  --clock-ghost: rgb(22, 5, 5);
  --score-ghost: rgb(22, 16, 2);
  --status-line: var(--line-soft);
  --toast-bg: var(--text);
  --toast-ink: var(--bg);
  --toast-off: var(--off);
}
/* Outdoor mode (boards 14–19): a light board for daylight courts. No clock box (its grey would cost the clock
   contrast); faint unlit segments keep each digit's place (without them a 1 drifts right and a short reading looks
   off-centre); the toast turns dark so it still stands out on white. */
.outdoor {
  --board-bg: #FFFFFF;
  --board-text: #0A0A0A;
  --clock: #0A0A0A;
  --score: #B0121B;
  --clock-box: transparent;
  --clock-box-border: transparent;
  --clock-ghost: #EEEFF1;
  --score-ghost: #F6E7E8;
  --status-line: #E3E5E8;
  --toast-bg: #111317;
  --toast-ink: #F5F2EA;
  --toast-off: #8B919B;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Barlow Condensed', sans-serif; }
.screen { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: var(--bg); }
.layer { position: absolute; inset: 0; }

/* Scoreboard */
.board { display: flex; flex-direction: column; height: 100%; background: var(--board-bg); color: var(--board-text); }
.clock-row { height: 476px; padding-top: 36px; display: flex; justify-content: center; }
.clock-box { width: 1240px; height: 440px; background: var(--clock-box); border: 2px solid var(--clock-box-border); border-radius: 32px;
  display: flex; align-items: center; justify-content: center; }
.led { display: grid; justify-items: end; align-items: center; font-family: 'DSEG7 Classic', monospace; font-weight: 700; line-height: 1; }
.led > span { grid-area: 1 / 1; }
.led.clock { font-size: 330px; color: var(--clock); }
.led.clock .ghost { color: var(--clock-ghost); }
.led.score { font-size: 330px; color: var(--score); }
.led.score .ghost { color: var(--score-ghost); }
.teams { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 260px minmax(0, 1fr); }
.team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-width: 0; }
.team-name { max-width: 800px; font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: 0.03em;
  text-transform: uppercase; white-space: nowrap; }
/* Large layout (boards 11–13): no clock box; clock and scores share one LED size, at least 36 px from every edge. */
.board.large .clock-row { height: 446px; padding-top: 36px; align-items: center; }
.board.large .led.clock, .board.large .led.score { font-size: 410px; }
.board.large .teams { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.board.large .team { gap: 14px; }
.board.large .team-name { font-size: 56px; }
/* Possession arrow (boards 20–23): centred between the scores, on the same rows as the team columns; the label lines
   up with the team names and the arrow pair with the score digits. The lit arrow uses the score color, the other one
   its unlit ghost. */
.teams { position: relative; }
.poss { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.poss .label, .fouls .label { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: 0.08em; white-space: nowrap; }
.poss .label { height: 84px; display: flex; align-items: center; }
.poss .arrows { height: 330px; display: flex; align-items: center; gap: 28px; }
.board.large .poss { gap: 14px; }
.board.large .poss .label { height: 56px; }
.board.large .poss .arrows { height: 410px; gap: 24px; }
/* FIBA rules (boards 24–33): team fouls in the corners beside the clock, the period between the scores with the
   possession arrows on either side of it (drawn unlit while the arrow is hidden). Fouls are `led score` digits,
   `led clock` from the first foul with free throws (the 5th of a period); the period is a `led clock` digit. The
   size rules below come after .led.clock / .led.score, so they win. */
.fouls { position: absolute; top: 36px; width: 268px; height: 440px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 24px; }
.fouls.left { left: 36px; }
.fouls.right { right: 36px; }
.led.fouls-n, .led.period-n { font-size: 250px; }
.board.large .fouls { width: 218px; height: 410px; }
.board.large .fouls .label { font-size: 48px; }
.board.large .led.fouls-n { font-size: 230px; }
.board.large .period .arrows { gap: 14px; }
.board.large .led.period-n { font-size: 180px; }
/* Hold ↓: the foul corners get a ring, like quick clock adjust's around the clock. */
.foul-ring { position: absolute; top: 22px; width: 296px; height: 468px; border: 6px solid var(--board-text); border-radius: 32px; }
.foul-ring.left { left: 22px; }
.foul-ring.right { right: 22px; }
.status { height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 48px;
  border-top: 2px solid var(--status-line); font-size: 28px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.status .state { display: flex; align-items: center; gap: 12px; color: var(--board-text); }

/* Shared bits */
.keycap { border: 2px solid currentColor; border-radius: 8px; padding: 0 10px; line-height: 38px; white-space: nowrap; }
.hints { display: flex; align-items: center; justify-content: center; gap: 40px; font-size: 28px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.hint { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.scrim { position: absolute; inset: 0; background: rgba(7, 8, 10, 0.8); }
.modal { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 28px; }
.eyebrow { font-size: 30px; font-weight: 600; letter-spacing: 0.24em; color: var(--muted); }

/* Bottom bars over the status bar */
.toast { position: absolute; left: 500px; bottom: 0; width: 920px; height: 64px; padding: 0 28px; display: flex; align-items: center;
  justify-content: space-between; background: var(--toast-bg); color: var(--toast-ink); border-radius: 16px 16px 0 0; }
.time-up-frame { position: absolute; inset: 0; border: 14px solid var(--alert-frame); }
/* .bar is 64 px tall, .bar.tall 88 px; each kind only sets its colors. */
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 48px; display: flex; align-items: center;
  justify-content: space-between; gap: 24px; }
.bar.tall { height: 88px; }
.time-up-bar { background: var(--alert); color: #FFFFFF; }
.btn { height: 64px; padding: 0 24px; border-radius: 12px; font-family: inherit; font-weight: 800; letter-spacing: 0.04em; }
.adjust-ring { position: absolute; left: 326px; top: 22px; width: 1268px; height: 468px; border: 8px solid var(--adjust); border-radius: 40px; }
.adjust-ring.large { left: 259px; top: 12px; width: 1402px; height: 458px; }
.adjust-bar { background: var(--adjust); color: var(--bg); }
.foul-bar { background: var(--toast-bg); color: var(--toast-ink); }
.break-bar { background: var(--panel); border-top: 2px solid var(--line); color: var(--text); }

/* Menu */
.menu { position: absolute; top: 0; right: 0; width: 820px; height: 1080px; background: var(--panel); border-left: 2px solid var(--line);
  display: flex; flex-direction: column; }
.menu-group { display: flex; flex-direction: column; padding-bottom: 14px; border-bottom: 2px solid #22262D; }
.menu-group:last-child { border-bottom-color: transparent; }
.menu-row { height: 70px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; font-size: 38px; font-weight: 600; }
.menu-row .value { display: flex; align-items: center; gap: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
.menu-row .value span { min-width: 120px; text-align: center; }
.menu-row.focused { background: var(--text); color: var(--bg); }
.menu-row.focused .value { color: var(--bg); }
/* Under FIBA rules the rows outgrow the panel: the list scrolls with the focus and fades out where it is cut. */
.menu-list { flex-grow: 1; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.menu-list.cut::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
  background: linear-gradient(transparent, var(--panel)); }

/* How to use (menu → How to use, and once on the first launch): a generic remote, since every Android TV remote has
   the D-pad, its center button and BACK, and what each key does. */
.help { padding: 72px 96px 56px; display: flex; gap: 112px; background: var(--panel); height: 100%; }
.help-side { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.remote { width: 300px; height: 640px; background: var(--panel-raised); border: 2px solid #2A2E35; border-radius: 150px 150px 100px 100px;
  display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 44px; }
.rkey { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 22px; font-weight: 600; letter-spacing: 0.1em; color: var(--faint); }
.rkey.live { color: var(--text); font-weight: 700; }
.dot { border-radius: 50%; border: 3px solid var(--off); display: flex; align-items: center; justify-content: center; }
.rkey.live .dot { border: 4px solid var(--text); }
.dpad { position: relative; width: 236px; height: 236px; flex-shrink: 0; border-radius: 50%; border: 4px solid var(--text); font-size: 30px; font-weight: 700; }
.dpad > div { position: absolute; }
.help-main { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
.map { display: grid; grid-template-columns: 180px minmax(0, 1.4fr) minmax(0, 1fr); margin-top: 36px; border-top: 2px solid #2A2E35; }
.map .th { padding: 16px 0; font-size: 26px; font-weight: 600; letter-spacing: 0.2em; color: var(--muted); border-bottom: 2px solid #2A2E35; }
.map .td { height: 108px; padding-right: 24px; border-bottom: 2px solid #1C1F24; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.map .main { font-size: 38px; font-weight: 600; line-height: 1.15; }
.map .main.none { color: var(--faint); }
.map .note { font-size: 26px; font-weight: 500; line-height: 1.2; color: var(--muted); }
.map .kc { align-self: flex-start; min-width: 76px; text-align: center; border: 3px solid var(--text); border-radius: 12px; padding: 2px 14px; font-size: 34px; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
/* outdoor-<board> shows <board> in outdoor mode. */
const outdoor = (params.get('board') || '').startsWith('outdoor-');

const STRINGS = {
  en: {
    home: 'HOME', away: 'AWAY',
    running: 'CLOCK RUNNING', stopped: 'CLOCK STOPPED',
    back: 'BACK', undo: 'UNDO', cancel: 'CANCEL',
    timeUp: 'TIME UP', result: 'Home wins 62–58',
    newGameBtn: 'NEW GAME', resetBtn: 'RESET CLOCK · KEEP SCORE',
    menu: 'Menu',
    menuLabels: {
      gameClock: 'Game clock', gameLength: 'Game length', period: 'Period', periodLength: 'Period length',
      homeScore: 'Home score', awayScore: 'Away score', homeFouls: 'Home fouls', awayFouls: 'Away fouls',
      newGame: 'New game', rules: 'Rules', layout: 'Layout', mode: 'Mode', language: 'Language', help: 'How to use', exit: 'Exit',
    },
    menuValues: { pickup: 'Pickup', classic: 'Classic', indoor: 'Indoor', outdoor: 'Outdoor', language: 'English' },
    move: 'MOVE', change: 'CHANGE', open: 'OPEN', close: 'CLOSE',
    adjust: 'ADJUST CLOCK', was: 'was 07:42', min: '±1 MIN', sec: '±1 SEC', done: 'DONE',
    setClock: 'SET GAME CLOCK', setClockSub: 'Was 07:42 · clock stopped', minLabel: 'MIN', secLabel: 'SEC',
    field: 'FIELD', save: 'SAVE',
    admin: 'ADMIN', exitTitle: 'Exit the scoreboard?',
    exitBody: 'Score and clock are saved. Open tablero from the apps row to come back to the scoreboard.',
    exit: 'EXIT', holdOk: 'HOLD OK · 2 S',
    helpEyebrow: 'HOW TO USE', helpTitle: 'Remote control',
    keyCol: 'KEY', pressCol: 'PRESS', holdCol: 'HOLD',
    helpRows: [
      ['OK', 'Start / stop clock', 'The center button', '—'],
      ['←', 'Home +1', 'Press twice for 2 points, three times for 3', 'Home −1'],
      ['→', 'Away +1', 'Press twice for 2 points, three times for 3', 'Away −1'],
      ['↑', 'Flip possession arrow', 'The first press points to HOME', 'Hide arrow'],
      ['↓', 'Adjust clock', 'Works while the clock runs', '—'],
      ['BACK', 'Undo last action', 'Fixes mistakes, even a new game', 'Open menu'],
    ],
    helpLegend: 'Grey keys aren\'t used. To see this again: Menu (hold BACK) → How to use.',
    rk: { back: 'BACK', home: 'HOME' },
    helpRemote: 'Your remote may look different',
    feedbackTeam: 'HOME +3',
    poss: 'POS', feedbackPoss: 'POS → AWAY',
    fouls: 'FOULS', period: 'PERIOD', ot: 'OT',
    teamFoul: 'TEAM FOUL', feedbackFoul: 'AWAY FOUL',
    periodEnd: 'END OF PERIOD 2', leads: 'Home leads 48–45', halftimeBtn: 'HALFTIME · 15:00', skipBreak: 'SKIP BREAK',
    halftime: 'HALFTIME', breakNext: 'Period 3 starts at 0:00', adjustShort: 'ADJUST', endBreak: 'END BREAK',
    helpFoul: ['↓', 'Adjust clock', 'Works while the clock runs, and in breaks', 'Team foul', 'Then ← home or → away'],
  },
  es: {
    home: 'LOCAL', away: 'VISITA',
    running: 'RELOJ EN MARCHA', stopped: 'RELOJ DETENIDO',
    back: 'ATRÁS', undo: 'DESHACER', cancel: 'CANCELAR',
    timeUp: 'FIN DEL PARTIDO', result: 'Gana Local 62–58',
    newGameBtn: 'NUEVO PARTIDO', resetBtn: 'REINICIAR RELOJ · MISMO PUNTAJE',
    menu: 'Menú',
    menuLabels: {
      gameClock: 'Reloj de juego', gameLength: 'Duración del partido', period: 'Periodo', periodLength: 'Duración del periodo',
      homeScore: 'Puntos Local', awayScore: 'Puntos Visita', homeFouls: 'Faltas Local', awayFouls: 'Faltas Visita',
      newGame: 'Nuevo partido', rules: 'Reglas', layout: 'Diseño', mode: 'Modo', language: 'Idioma', help: 'Cómo se usa', exit: 'Salir',
    },
    menuValues: { pickup: 'Recreativo', classic: 'Clásico', indoor: 'Interior', outdoor: 'Exterior', language: 'Español' },
    move: 'MOVER', change: 'CAMBIAR', open: 'ABRIR', close: 'CERRAR',
    adjust: 'AJUSTAR RELOJ', was: 'antes 07:42', min: '±1 MIN', sec: '±1 SEG', done: 'LISTO',
    setClock: 'FIJAR RELOJ DE JUEGO', setClockSub: 'Antes 07:42 · reloj detenido', minLabel: 'MIN', secLabel: 'SEG',
    field: 'CAMPO', save: 'GUARDAR',
    admin: 'ADMINISTRACIÓN', exitTitle: '¿Salir del marcador?',
    exitBody: 'El puntaje y el reloj quedan guardados. Abre tablero desde la fila de apps para volver al marcador.',
    exit: 'SALIR', holdOk: 'MANTÉN OK · 2 S',
    helpEyebrow: 'CÓMO SE USA', helpTitle: 'Control remoto',
    keyCol: 'TECLA', pressCol: 'PRESIONAR', holdCol: 'MANTENER',
    helpRows: [
      ['OK', 'Iniciar / detener reloj', 'El botón del centro', '—'],
      ['←', 'Local +1', 'Presiona dos veces para 2 puntos, tres para 3', 'Local −1'],
      ['→', 'Visita +1', 'Presiona dos veces para 2 puntos, tres para 3', 'Visita −1'],
      ['↑', 'Cambiar flecha de posesión', 'La primera vez apunta a LOCAL', 'Ocultar flecha'],
      ['↓', 'Ajustar reloj', 'Funciona con el reloj en marcha', '—'],
      ['ATRÁS', 'Deshacer última acción', 'Corrige errores, incluso un nuevo partido', 'Abrir menú'],
    ],
    helpLegend: 'Las teclas grises no se usan. Para volver a verla: Menú (mantén ATRÁS) → Cómo se usa.',
    rk: { back: 'ATRÁS', home: 'INICIO' },
    helpRemote: 'Tu control puede verse distinto',
    feedbackTeam: 'LOCAL +3',
    poss: 'POS', feedbackPoss: 'POS → VISITA',
    fouls: 'FALTAS', period: 'PERIODO', ot: 'TIEMPO EXTRA',
    teamFoul: 'FALTA DE EQUIPO', feedbackFoul: 'FALTA VISITA',
    periodEnd: 'FIN DEL PERIODO 2', leads: 'Local va ganando 48–45', halftimeBtn: 'MEDIO TIEMPO · 15:00', skipBreak: 'SIN DESCANSO',
    halftime: 'MEDIO TIEMPO', breakNext: 'El periodo 3 empieza en 0:00', adjustShort: 'AJUSTAR', endBreak: 'TERMINAR DESCANSO',
    helpFoul: ['↓', 'Ajustar reloj', 'Funciona con el reloj en marcha y en los descansos', 'Falta de equipo', 'Luego ← local o → visita'],
  },
};

const lang = STRINGS[params.get('lang')] ? params.get('lang') : 'en';
const T = STRINGS[lang];
document.documentElement.lang = lang;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* As the app draws them (LedText.kt): MM:SS and SS.t readings over fixed 88:88 and 88.8 cells. */
const ghost = (s) => (s.includes(':') ? '88:88' : '88.8');
const scoreGhost = (s) => '8'.repeat(Math.max(2, s.length));
const hint = (key, label) => `<span class="hint"><span class="keycap">${esc(key)}</span>${esc(label)}</span>`;
const PAUSE_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="1" width="5" height="16" rx="1" fill="currentColor"/><rect x="11" y="1" width="5" height="16" rx="1" fill="currentColor"/></svg>';
const RUN_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="currentColor"/></svg>';
const CHEVRON_L = '<svg width="24" height="24" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4 L7 11 L14 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEVRON_R = '<svg width="24" height="24" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 4 L15 11 L8 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* A possession arrow, pointing left or right; lit in the score color or dim like an unlit segment. */
function arrow(dir, lit, h) {
  const w = Math.round(h * 0.8);
  const points = dir === 'left' ? `${w},0 ${w},${h} 0,${h / 2}` : `0,0 0,${h} ${w},${h / 2}`;
  const color = lit ? 'var(--score)' : 'var(--score-ghost)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="visible" aria-hidden="true"><polygon points="${points}" fill="${color}" stroke="${color}" stroke-width="10" stroke-linejoin="round"/></svg>`;
}

/* possession: 'home', 'away' or '' (hidden, the default after a new game). Under FIBA rules ({ period, label }) the
   period sits between the arrows and its label replaces POS; the arrows then always show, both unlit while hidden. */
function possession(side, large, fiba = null) {
  if (!side && !fiba) return '';
  const h = large ? (fiba ? 84 : 100) : 120;
  const period = fiba ? `<div class="led clock period-n"><span class="ghost">8</span><span>${fiba.period}</span></div>` : '';
  return `
    <div class="poss ${fiba ? 'period' : ''}">
      <div class="label">${esc(fiba ? fiba.label || T.period : T.poss)}</div>
      <div class="arrows">${arrow('left', side === 'home', h)}${period}${arrow('right', side === 'away', h)}</div>
    </div>`;
}

/* FIBA: the 5th team foul of a period is the first with free throws. */
const PENALTY_FOULS = 5;

/* A team's fouls in the corner beside the clock on its side. */
function fouls(side, n) {
  return `
    <div class="fouls ${side}">
      <div class="label">${esc(T.fouls)}</div>
      <div class="led ${n >= PENALTY_FOULS ? 'clock' : 'score'} fouls-n"><span class="ghost">8</span><span>${n}</span></div>
    </div>`;
}

function team(name, score) {
  return `
    <div class="team">
      <div class="team-name">${esc(name)}</div>
      <div class="led score"><span class="ghost">${scoreGhost(score)}</span><span>${esc(score)}</span></div>
    </div>`;
}

/* fiba: { fouls: [home, away], period, label } shows the board under FIBA rules; null under Pickup rules. */
function scoreboard({ leftScore = '48', rightScore = '45', clock = '07:42', running = true, large = false, poss = '', fiba = null } = {}) {
  const state = running ? `${RUN_ICON}<span>${T.running}</span>` : `${PAUSE_ICON}<span>${T.stopped}</span>`;
  const led = `<div class="led clock"><span class="ghost">${ghost(clock)}</span><span>${esc(clock)}</span></div>`;
  const middle = possession(poss, large, fiba);
  const corners = fiba ? fouls('left', fiba.fouls[0]) + fouls('right', fiba.fouls[1]) : '';
  return large ? `
    <div class="board large">
      <div class="clock-row">${led}</div>
      <div class="teams">${team(T.home, leftScore)}${team(T.away, rightScore)}${middle}</div>
      <div class="status"><div class="state">${state}</div></div>
      ${corners}
    </div>` : `
    <div class="board">
      <div class="clock-row"><div class="clock-box">${led}</div></div>
      <div class="teams">${team(T.home, leftScore)}<div></div>${team(T.away, rightScore)}${middle}</div>
      <div class="status"><div class="state">${state}</div></div>
      ${corners}
    </div>`;
}

/* A tall bar's title and its detail. */
function barTitle(title, detail, detailColor = 'inherit') {
  return `
      <div style="display:flex;align-items:baseline;gap:20px;min-width:0">
        <span style="font-size:48px;font-weight:800;letter-spacing:0.06em;white-space:nowrap">${esc(title)}</span>
        <span style="font-size:30px;font-weight:600;white-space:nowrap;color:${detailColor}">${esc(detail)}</span>
      </div>`;
}

/* The time-up bar: a title and detail, the focused choice and the other one. */
function timeUpBar(title, detail, focused, other) {
  return `
    <div class="time-up-frame"></div>
    <div class="bar tall time-up-bar">
      ${barTitle(title, detail)}
      <div style="display:flex;align-items:center;gap:16px;flex-shrink:0">
        <button class="btn" style="border:4px solid #fff;background:#fff;color:#A3180E;font-size:32px">${esc(focused)}</button>
        <button class="btn" style="border:3px solid rgba(255,255,255,0.7);background:transparent;color:#fff;font-size:28px;font-weight:700">${esc(other)}</button>
      </div>
    </div>`;
}

/* A FIBA game in period 2: AWAY's 5th foul gives HOME free throws from now on. */
const FIBA_GAME = { poss: 'home', fiba: { fouls: [3, 5], period: '2' } };

/* The confirmation after an action, with the Undo hint. */
function toast(main, detail = '') {
  return `
    <div class="toast">
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:40px;font-weight:800;letter-spacing:0.04em">${esc(main)}</span>
        ${detail ? `<span style="font-size:32px;font-weight:600;color:var(--toast-off)">${esc(detail)}</span>` : ''}
      </div>
      <div class="hint" style="font-size:28px;font-weight:600;letter-spacing:0.06em;color:var(--toast-off)"><span class="keycap">${esc(T.back)}</span>${esc(T.undo)}</div>
    </div>`;
}

const BOARDS = {
  'live-game': () => scoreboard(),

  'final-minute': () => scoreboard({ leftScore: '58', rightScore: '59', clock: '38.4' }),

  'time-up': (large = false) => `
    ${scoreboard({ leftScore: '62', rightScore: '58', clock: '0.0', running: false, large })}
    ${timeUpBar(T.timeUp, T.result, T.newGameBtn, T.resetBtn)}`,

  'action-feedback': () => `
    ${scoreboard({ leftScore: '51', clock: '06:58', running: false })}
    ${toast(T.feedbackTeam, '48 → 51')}`,

  /* Rows are [label key, value, ←/→ adjusts it]. Under FIBA rules the period and the fouls join, and game length
     becomes period length. */
  'menu': (fiba = false) => {
    const V = T.menuValues;
    const rowGroups = [
      [['gameClock', '07:42', false], ...(fiba ? [['period', '2', true], ['periodLength', '10:00', true]] : [['gameLength', '10:00', true]])],
      [['homeScore', '48', true], ['awayScore', '45', true], ...(fiba ? [['homeFouls', '3', true], ['awayFouls', '5', true]] : [])],
      [['newGame', '', false], ['rules', fiba ? 'FIBA' : V.pickup, true], ['layout', V.classic, true],
        ['mode', outdoor ? V.outdoor : V.indoor, true], ['language', V.language, true], ['help', '', false], ['exit', '', false]],
    ];
    const focused = fiba ? 'awayFouls' : outdoor ? 'mode' : 'homeScore';
    const groups = rowGroups.map((rows) => `<div class="menu-group">${rows.map(([key, value, adjust]) => `
      <div class="menu-row ${key === focused ? 'focused' : ''}">
        <span>${esc(T.menuLabels[key])}</span>
        <span class="value">${adjust ? CHEVRON_L : ''}<span>${esc(value)}</span>${CHEVRON_R}</span>
      </div>`).join('')}</div>`).join('');
    return `
      ${scoreboard({ running: false, ...(fiba ? FIBA_GAME : {}) })}
      <div class="scrim" style="background:rgba(7,8,10,0.74)"></div>
      <div class="menu">
        <div style="padding:44px 48px 24px;display:flex;align-items:baseline;justify-content:space-between">
          <div style="font-size:60px;font-weight:700">${esc(T.menu)}</div>
          <div style="font-size:28px;font-weight:600;letter-spacing:0.12em;color:var(--muted)">${esc(T.stopped)}</div>
        </div>
        <div class="menu-list ${fiba ? 'cut' : ''}">${groups}</div>
        <div class="hints" style="height:80px;padding:0 48px;justify-content:space-between;gap:16px;border-top:2px solid var(--line);font-size:24px">
          ${hint('↑ ↓', T.move)}${hint('← →', T.change)}${hint('OK', T.open)}${hint(T.back, T.close)}
        </div>
      </div>`;
  },

  'quick-clock-adjust': (large = false) => `
    ${scoreboard({ clock: '08:42', large })}
    <div class="adjust-ring ${large ? 'large' : ''}"></div>
    <div class="bar adjust-bar">
      <div style="display:flex;align-items:baseline;gap:18px">
        <span style="font-size:36px;font-weight:800;letter-spacing:0.06em">${esc(T.adjust)}</span>
        <span style="font-size:36px;font-weight:800">+1:00</span>
        <span style="font-size:30px;font-weight:600;color:var(--adjust-ink)">${esc(T.was)}</span>
      </div>
      <div class="hints" style="gap:28px;font-size:26px;color:var(--adjust-ink)">
        ${hint('↑ ↓', T.min)}${hint('← →', T.sec)}${hint('OK', T.done)}${hint(T.back, T.cancel)}
      </div>
    </div>`,

  'set-game-clock': () => {
    const field = (value, label, focused) => `
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        ${focused ? '<svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><path d="M8 32 L28 10 L48 32" fill="none" stroke="#FFB21E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<div style="height:40px"></div>'}
        <div class="led" style="width:300px;height:300px;justify-items:center;border-radius:20px;font-size:170px;
          ${focused ? 'border:6px solid var(--adjust);background:var(--panel-raised)' : 'border:4px solid #2A2E35'};color:var(--text)">
          <span>${value}</span></div>
        <div style="font-size:26px;font-weight:600;letter-spacing:0.2em;color:${focused ? 'var(--adjust)' : 'var(--muted)'}">${esc(label)}</div>
        ${focused ? '<svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><path d="M8 8 L28 30 L48 8" fill="none" stroke="#FFB21E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<div style="height:40px"></div>'}
      </div>`;
    return `
      ${scoreboard({ running: false })}
      <div class="scrim"></div>
      <div class="modal" style="left:400px;top:150px;width:1120px;height:780px;padding:44px 56px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
          <div class="eyebrow">${esc(T.setClock)}</div>
          <div style="font-size:30px;font-weight:500;color:var(--soft)">${esc(T.setClockSub)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:24px">
          ${field('07', T.minLabel, false)}
          <div style="font-family:'DSEG7 Classic';font-size:170px;color:var(--text)">:</div>
          ${field('51', T.secLabel, true)}
        </div>
        <div class="hints" style="align-self:stretch;height:84px;border-top:2px solid var(--line);gap:44px">
          ${hint('↑ ↓', T.change)}${hint('← →', T.field)}${hint('OK', T.save)}${hint(T.back, T.cancel)}
        </div>
      </div>`;
  },

  'exit-confirm': () => `
    ${scoreboard({ running: false })}
    <div class="scrim"></div>
    <div class="modal" style="left:460px;top:230px;width:1000px;height:620px;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="eyebrow">${esc(T.admin)}</div>
        <div style="font-size:72px;font-weight:700;line-height:1">${esc(T.exitTitle)}</div>
        <div style="font-size:34px;font-weight:500;line-height:1.3;color:var(--soft)">${esc(T.exitBody)}</div>
      </div>
      <div style="display:flex;gap:28px">
        <button class="btn" style="flex:1 1 0;height:104px;border:3px solid var(--off);background:transparent;color:var(--text);font-size:40px;font-weight:700">${esc(T.cancel)}</button>
        <button class="btn" style="flex:1 1 0;height:104px;border:6px solid var(--text);background:var(--panel-raised);color:var(--text);position:relative;overflow:hidden;padding:0">
          <span style="position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--alert)"></span>
          <span style="position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05">
            <span style="font-size:40px;font-weight:700;letter-spacing:0.06em">${esc(T.exit)}</span>
            <span style="font-size:24px;font-weight:600;letter-spacing:0.12em">${esc(T.holdOk)}</span>
          </span>
        </button>
      </div>
    </div>`,

  /* Under FIBA rules the ↓ row gains its hold: a team foul. */
  'remote-mapping': (fiba = false) => {
    const helpRows = fiba ? T.helpRows.map((row) => (row[0] === T.helpFoul[0] ? T.helpFoul : row)) : T.helpRows;
    const rows = helpRows.map(([key, press, note, hold, holdNote]) => `
      <div class="td"><span class="kc">${esc(key)}</span></div>
      <div class="td"><span class="main">${esc(press)}</span><span class="note">${esc(note)}</span></div>
      <div class="td"><span class="main ${hold === '—' ? 'none' : ''}">${esc(hold)}</span>${holdNote ? `<span class="note">${esc(holdNote)}</span>` : ''}</div>`).join('');
    const pill = '<div style="width:96px;height:40px;border-radius:20px;border:3px solid var(--off)"></div>';
    const small = '<div class="dot" style="width:48px;height:48px"></div>';
    return `
      <div class="help">
        <div class="help-side">
          <div class="remote">
            <div class="dpad">
              <div style="top:10px;left:0;right:0;text-align:center">↑</div>
              <div style="bottom:10px;left:0;right:0;text-align:center">↓</div>
              <div style="left:16px;top:0;bottom:0;display:flex;align-items:center">←</div>
              <div style="right:16px;top:0;bottom:0;display:flex;align-items:center">→</div>
              <div style="left:58px;top:58px;width:112px;height:112px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800">OK</div>
            </div>
            <div style="display:flex;gap:72px">
              <div class="rkey live"><div class="dot" style="width:76px;height:76px">
                <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 8 L5 15 L12 22 M5 15 H20 a7 7 0 0 1 0 14 H14" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>${esc(T.rk.back)}</div>
              <div class="rkey"><div class="dot" style="width:76px;height:76px">
                <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16 L16 6 L27 16 M9 13 V26 H23 V13" fill="none" stroke="#3A3F47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>${esc(T.rk.home)}</div>
            </div>
            <div style="display:flex;gap:28px">${small}${small}${small}</div>
            <div style="display:flex;gap:20px">${pill}${pill}</div>
          </div>
          <div style="font-size:26px;font-weight:500;color:var(--muted)">${esc(T.helpRemote)}</div>
        </div>
        <div class="help-main">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div class="eyebrow">${esc(T.helpEyebrow)}</div>
            <div style="font-size:72px;font-weight:700;line-height:1">${esc(T.helpTitle)}</div>
          </div>
          <div class="map">
            <div class="th">${esc(T.keyCol)}</div><div class="th">${esc(T.pressCol)}</div><div class="th">${esc(T.holdCol)}</div>
            ${rows}
          </div>
          <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:48px">
            <div style="display:flex;align-items:center;gap:14px;font-size:28px;font-weight:500;color:var(--soft);min-width:0">
              <span style="width:18px;height:18px;flex-shrink:0;border-radius:4px;border:3px solid var(--off)"></span>
              <span>${esc(T.helpLegend)}</span>
            </div>
            <div class="hints" style="flex-shrink:0">${hint(T.back, T.close)}</div>
          </div>
        </div>
      </div>`;
  },
};

BOARDS['large-live-game'] = () => scoreboard({ large: true });
BOARDS['large-time-up'] = () => BOARDS['time-up'](true);
BOARDS['large-quick-clock-adjust'] = () => BOARDS['quick-clock-adjust'](true);

for (const board of ['time-up', 'action-feedback', 'quick-clock-adjust', 'menu']) {
  BOARDS[`outdoor-${board}`] = BOARDS[board];
}
/* A 1, a short clock and one-digit scores: what the unlit segments have to hold in place. */
BOARDS['outdoor-live-game'] = () => scoreboard({ leftScore: '3', rightScore: '0', clock: '9:21' });
BOARDS['outdoor-large-live-game'] = () => scoreboard({ leftScore: '3', rightScore: '0', clock: '9:21', large: true });

BOARDS['possession'] = () => scoreboard({ poss: 'home' });
BOARDS['large-possession'] = () => scoreboard({ poss: 'home', large: true });
BOARDS['outdoor-possession'] = () => scoreboard({ leftScore: '3', rightScore: '0', clock: '9:21', poss: 'away' });
BOARDS['possession-feedback'] = () => `
  ${scoreboard({ clock: '06:58', running: false, poss: 'away' })}
  ${toast(T.feedbackPoss)}`;

/* FIBA rules (menu → Rules): fouls, periods, breaks and overtime. */
BOARDS['fiba-live-game'] = () => scoreboard(FIBA_GAME);
BOARDS['fiba-large-live-game'] = () => scoreboard({ ...FIBA_GAME, large: true });
BOARDS['outdoor-fiba-live-game'] = BOARDS['fiba-live-game'];
/* Hold ↓; the whistle has stopped the clock. ← or → adds the foul and closes the bar. */
BOARDS['fiba-team-foul'] = () => `
  ${scoreboard({ clock: '06:58', running: false, poss: 'home', fiba: { fouls: [3, 4], period: '2' } })}
  <div class="foul-ring left"></div><div class="foul-ring right"></div>
  <div class="bar foul-bar">
    <span style="font-size:36px;font-weight:800;letter-spacing:0.06em">${esc(T.teamFoul)}</span>
    <div class="hints" style="gap:28px;font-size:26px;color:var(--toast-off)">
      ${hint('←', T.home)}${hint('→', T.away)}${hint(T.back, T.cancel)}
    </div>
  </div>`;
BOARDS['fiba-foul-feedback'] = () => `
  ${scoreboard({ ...FIBA_GAME, clock: '06:58', running: false })}
  ${toast(T.feedbackFoul, '4 → 5')}`;
/* The clock reached 0 at the end of period 2: the halftime break, or straight on to period 3. */
BOARDS['fiba-period-end'] = () => `
  ${scoreboard({ clock: '0.0', running: false, poss: 'away', fiba: { fouls: [4, 5], period: '2' } })}
  ${timeUpBar(T.periodEnd, T.leads, T.halftimeBtn, T.skipBreak)}`;
/* The break counts down on the game clock; the board has moved on to period 3, so the fouls are back to 0. */
BOARDS['fiba-halftime'] = () => `
  ${scoreboard({ clock: '14:21', poss: 'away', fiba: { fouls: [0, 0], period: '3' } })}
  <div class="bar tall break-bar">
    ${barTitle(T.halftime, T.breakNext, 'var(--soft)')}
    <div class="hints" style="flex-shrink:0">${hint('↓', T.adjustShort)}${hint('OK', T.endBreak)}</div>
  </div>`;
/* Overtime fouls count as period 4 fouls, so HOME's 5 carry over. */
BOARDS['fiba-overtime'] = () => scoreboard({ leftScore: '74', rightScore: '72', clock: '03:27', poss: 'home',
  fiba: { fouls: [5, 3], period: '1', label: T.ot } });
BOARDS['fiba-menu'] = () => BOARDS['menu'](true);
BOARDS['fiba-remote-mapping'] = () => BOARDS['remote-mapping'](true);

const id = BOARDS[params.get('board')] ? params.get('board') : 'live-game';
document.title = `tablero — ${id} (${lang})`;
document.getElementById('root').innerHTML = `<div class="screen ${outdoor ? 'outdoor' : ''}">${BOARDS[id]()}</div>`;
</script>
</body>
</html>
